<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="generator" content="PhonicsMaker">
    <title>Phonics Storybook - Trial Page</title>
    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: "Comic Neue", serif;
            overflow: hidden;
            background-color: #000000;
        }

        @page {
            size: A5;
            margin: 0mm;
            marks: none;
        }

        @media print {
            body {
                width: 148mm;
                height: 210mm;
            }

            .page {
                width: 148mm;
                height: 210mm;
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                border: none;
                border-radius: 0;
            }
        }

        .page {
            position: relative;
            width: 100%;
            /* height: 100vh; */
            overflow: hidden;
        }

        .trial-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .page-number {
            position: absolute;
            bottom: 10mm;
            right: 10mm;
            font-size: 12px;
            color: #666;
            z-index: 2;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 3px 6px;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <div class="page">
        <img class="trial-image" src="{{ trial_image_path }}" alt="Trial Image">
        <div class="page-number">Page {{ page_no }}</div>
    </div>
</body>

</html>
