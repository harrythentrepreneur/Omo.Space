<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="generator" content="PhonicsMaker">
    <title>Phonics Storybook - Cover Page</title>
    <style>
        @font-face {
            font-family: '{{ font_family_name }}';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('{{ font_regular_path }}') format('truetype');
        }

        {% if font_bold_path %}
        @font-face {
            font-family: '{{ font_family_name }}';
            font-weight: 700;
            font-display: swap;
            src: url('{{ font_bold_path }}') format('truetype');
        }
        {% endif %}

        body {
            margin: 0;
            padding: 0;
            font-family: {{ css_font_family|safe }};
            overflow: hidden;
            background-color: #ffffff;
        }

        @page {
            size: A5;
            margin: 0mm;
            marks: none;
        }

        @media print {
            body {
                width: 148mm;
                height: 210mm;
            }

            .page {
                width: 148mm;
                height: 210mm;
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                border: none;
                border-radius: 0;
            }
        }

        .page {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .cover-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .generator-credit {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-family: {{ css_font_family|safe }};
            font-size: 14px;
            color: white;
            text-align: center;
            z-index: 2;
            padding: 5px 10px;
            border-radius: 3px;
            background-color: rgba(0, 0, 0, 0.5);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        
        .generator-credit a {
            color: #aad4ff;
            text-decoration: underline;
            text-underline-offset: 2px;
            font-weight: bold;
        }
        
        .generator-credit a:hover {
            color: #ffffff;
            text-decoration: none;
        }

        .standard-tag {
            position: absolute;
            bottom: 2%;
            left: 50%;
            transform: translateX(-50%);
            font-family: {{ css_font_family|safe }};
            font-size: 11px;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            z-index: 2;
            padding: 3px 8px;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 4px;
        }

        .series-badge {
            position: absolute;
            top: 4%;
            right: 4%;
            font-family: {{ css_font_family|safe }};
            font-size: 12px;
            font-weight: bold;
            color: white;
            background-color: rgba(0, 0, 0, 0.55);
            padding: 4px 10px;
            border-radius: 20px;
            z-index: 3;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }

    </style>
</head>

<body>
    <div class="page">
        <img class="cover-image" src="{{ cover_image_url }}" alt="Book Cover Image">
        {% if series_info and series_info.book_position and series_info.total_books %}
        <div class="series-badge">Book {{ series_info.book_position }} of {{ series_info.total_books }}</div>
        {% endif %}
        <div class="generator-credit">Generated by <a href="https://phonicsmaker.com/" target="_blank">PhonicsMaker</a></div>
        {% if standard_codes %}
        <div class="standard-tag">Audit Code: {{ standard_codes | join(', ') }}</div>
        {% endif %}
    </div>
</body>

</html>
