  path: source/SKILL.md
  sha256: e518520523e3d9cef7c487c5646cff47447252659497acd28151b7478f980859
image:
  base: debian-slim
  python: "3.12"
  packages:
    - modal==1.5.0
    - fastapi==0.109.0
    - jsonschema==4.26.0
resources:
  cpu: 1.0
  memory_mb: 512
  timeout_seconds: 270
  min_containers: 0
  max_containers: 4
endpoint:
  mode: async_job
  submit_path: /v1/runs
  result_path: /v1/runs/{call_id}
  auth: modal_proxy_token
  invalid_input_status: 422
  not_ready_status: 503
readiness:
  can_submit: true
  execution_kind: single_llm
  blockers: []
required_env_names:
  - GEMINI_API_KEY
steps:
  - id: generate
    type: llm
    operation: "chat.completions.strict_json"
    readiness: ready
    provider: gemini
    system_prompt: prompts/system.txt
input_schema: schemas/input.json
output_schema: schemas/output.json
frontend_manifest: manifest.json
capability_manifest: capability-manifest.json
pricing_report: pricing-report.json
tests:
  contract: tests/test_contract.py
  cases: tests/cases.json
  network_allowed: false
