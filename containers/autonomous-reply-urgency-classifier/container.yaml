spec_version: cognition.container/v1
name: "Autonomous Reply Urgency Classifier"
slug: autonomous-reply-urgency-classifier
version: "1.0.0"
status: ready
generated:
  compiler: skill-to-modal/0.7.0
  hand_edit_allowed: false
source:
