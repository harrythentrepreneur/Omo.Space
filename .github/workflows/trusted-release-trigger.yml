name: trusted-release-trigger

on:
  workflow_run:
    workflows:
      - generated-workflow-contracts
    types:
      - completed
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: trusted-production-release
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.event.outputs.eligible || steps.scheduled.outputs.eligible }}
      target_sha: ${{ steps.event.outputs.target_sha || steps.scheduled.outputs.target_sha }}
      run_id: ${{ steps.event.outputs.run_id || steps.scheduled.outputs.run_id }}
      run_attempt: ${{ steps.event.outputs.run_attempt || steps.scheduled.outputs.run_attempt }}
    steps:
      - name: Check out trusted controller from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
          path: controller
      - name: Validate completed workflow run
        if: github.event_name == 'workflow_run'
        id: event
        shell: bash
        run: >-
          python3 controller/tools/host-skill/release_trigger.py
          --event "$GITHUB_EVENT_PATH"
          --format github-output
          >> "$GITHUB_OUTPUT"
      - name: Fetch exact current main and completed contracts runs
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET \
            'repos/harrythentrepreneur/Omo.Space/actions/workflows/generated-workflow-contracts.yml/runs?branch=main&event=push&status=completed&per_page=20' \
            --jq '{workflow_runs:[.workflow_runs[]|{id,run_attempt,name,path,event,status,conclusion,head_branch,head_sha,head_repository:{full_name:.head_repository.full_name}}]}' \
            > "$RUNNER_TEMP/contracts-runs.json"
          gh api --method GET \
            'repos/harrythentrepreneur/Omo.Space/git/ref/heads/main' \
            --jq '{ref,object:{type:.object.type,sha:.object.sha}}' \
            > "$RUNNER_TEMP/main-ref.json"
      - name: Validate scheduled exact-main contracts run
        if: github.event_name == 'schedule'
        id: scheduled
        shell: bash
        run: >-
          python3 controller/tools/host-skill/release_trigger.py
          --runs "$RUNNER_TEMP/contracts-runs.json"
          --ref "$RUNNER_TEMP/main-ref.json"
          --format github-output
          >> "$GITHUB_OUTPUT"
      - name: Check out exact eligible green commit
        if: (steps.event.outputs.eligible || steps.scheduled.outputs.eligible) == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.event.outputs.target_sha || steps.scheduled.outputs.target_sha }}
          persist-credentials: false
          path: target
      - name: Verify exact detached target
        if: (steps.event.outputs.eligible || steps.scheduled.outputs.eligible) == 'true'
        shell: bash
        env:
          TARGET_SHA: ${{ steps.event.outputs.target_sha || steps.scheduled.outputs.target_sha }}
        run: test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
      - name: Record credential-free trigger decision
        if: github.event_name == 'workflow_run'
        shell: bash
        run: >-
          python3 controller/tools/host-skill/release_trigger.py
          --event "$GITHUB_EVENT_PATH"
          --format json

  finalize:
    needs: evaluate
    if: needs.evaluate.outputs.eligible == 'true' && vars.ISSUE141_PRODUCTION_FINALIZER_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Check out exact eligible green commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.evaluate.outputs.target_sha }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned finalizer dependencies
        run: python -m pip install --disable-pip-version-check modal==1.3.4 jsonschema==4.26.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: target/site/deploy/package-lock.json
      - name: Install reviewed Worker dependencies
        working-directory: target/site/deploy
        run: npm ci --ignore-scripts
      - name: Run deterministic production finalizer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_FINALIZER_TOKEN: ${{ secrets.RELEASE_FINALIZER_TOKEN }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOSTED_MODAL_PROXY_TOKEN_ID: ${{ secrets.HOSTED_MODAL_PROXY_TOKEN_ID }}
          HOSTED_MODAL_PROXY_TOKEN_SECRET: ${{ secrets.HOSTED_MODAL_PROXY_TOKEN_SECRET }}
          PRODUCTION_CANARY_API_KEY: ${{ secrets.PRODUCTION_CANARY_API_KEY }}
        run: >-
          python3 target/tools/host-skill/production_release_controller.py
          --trigger-sha "${{ needs.evaluate.outputs.target_sha }}"
          --run-id "${{ needs.evaluate.outputs.run_id }}"
          --run-attempt "${{ needs.evaluate.outputs.run_attempt }}"
