name: trusted-release-trigger

on:
  workflow_run:
    workflows:
      - generated-workflow-contracts
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: trusted-production-release
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.trigger.outputs.eligible }}
      target_sha: ${{ steps.trigger.outputs.target_sha }}
      run_id: ${{ steps.trigger.outputs.run_id }}
      run_attempt: ${{ steps.trigger.outputs.run_attempt }}
    steps:
      - name: Check out trusted controller from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
          path: controller
      - name: Validate completed workflow run
        id: trigger
        shell: bash
        run: >-
          python3 controller/tools/host-skill/release_trigger.py
          --event "$GITHUB_EVENT_PATH"
          --format github-output
          >> "$GITHUB_OUTPUT"
      - name: Check out exact eligible green commit
        if: steps.trigger.outputs.eligible == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.trigger.outputs.target_sha }}
          persist-credentials: false
          path: target
      - name: Verify exact detached target
        if: steps.trigger.outputs.eligible == 'true'
        shell: bash
        env:
          TARGET_SHA: ${{ steps.trigger.outputs.target_sha }}
        run: test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
      - name: Record credential-free trigger decision
        shell: bash
        run: >-
          python3 controller/tools/host-skill/release_trigger.py
          --event "$GITHUB_EVENT_PATH"
          --format json

  finalize:
    needs: evaluate
    if: needs.evaluate.outputs.eligible == 'true' && vars.ISSUE141_PRODUCTION_FINALIZER_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Check out exact eligible green commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.evaluate.outputs.target_sha }}
          persist-credentials: false
          path: target
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: target/site/deploy/package-lock.json
      - name: Install reviewed Worker dependencies
        working-directory: target/site/deploy
        run: npm ci --ignore-scripts
      - name: Run deterministic production finalizer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_FINALIZER_TOKEN: ${{ secrets.RELEASE_FINALIZER_TOKEN }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOSTED_MODAL_PROXY_TOKEN_ID: ${{ secrets.HOSTED_MODAL_PROXY_TOKEN_ID }}
          HOSTED_MODAL_PROXY_TOKEN_SECRET: ${{ secrets.HOSTED_MODAL_PROXY_TOKEN_SECRET }}
          PRODUCTION_CANARY_API_KEY: ${{ secrets.PRODUCTION_CANARY_API_KEY }}
        run: >-
          python3 target/tools/host-skill/production_release_controller.py
          --trigger-sha "${{ needs.evaluate.outputs.target_sha }}"
          --run-id "${{ needs.evaluate.outputs.run_id }}"
          --run-attempt "${{ needs.evaluate.outputs.run_attempt }}"
