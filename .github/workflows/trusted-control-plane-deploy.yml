name: trusted-control-plane-deploy

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'harrythentrepreneur/Omo.Space' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: trusted-control-plane-deploy
      cancel-in-progress: false
    steps:
      - name: Check out exact protected main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact dispatch revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/deploy/package-lock.json
      - name: Install pinned Worker dependencies
        working-directory: site/deploy
        shell: bash
        run: |
          npm ci --ignore-scripts
          npx --no-install wrangler --version | grep -Fx '4.125.0'
      - name: Verify reviewed selector and dry run
        working-directory: site/deploy
        shell: bash
        run: |
          test "$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('wrangler.toml').read_text(encoding='utf-8')
          match = re.search(r'^OMO_BUILDER_BASE_REVISION = "([0-9a-f]{40})"$', text, re.MULTILINE)
          if match is None:
              raise SystemExit(1)
          print(match.group(1))
          PY
          )" = "d0b5ace1116f1483c7e818cab775b68ab357e2a6"
          npx --no-install wrangler deploy --dry-run --keep-vars --env=""
      - name: Deploy reviewed Worker
        working-directory: site/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -o pipefail
          npx --no-install wrangler deploy --keep-vars --env="" --message "omo-control-plane:$GITHUB_SHA" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
      - name: Read back 100 percent active version
        id: allocation
        working-directory: site/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          npx --no-install wrangler deployments status --json --env="" > "$RUNNER_TEMP/deployment.json"
          mapfile -t receipts < <(grep -E '^Current Version ID: [0-9a-f-]+$' "$RUNNER_TEMP/deploy.log")
          test "${#receipts[@]}" -eq 1
          version_id="${receipts[0]#Current Version ID: }"
          [[ "$version_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          npx --no-install wrangler versions view "$version_id" --json --env="" > "$RUNNER_TEMP/version.json"
          python3 ../../tools/host-skill/verify_control_plane_deployment.py \
            --deploy-log "$RUNNER_TEMP/deploy.log" \
            --deployment "$RUNNER_TEMP/deployment.json" \
            --version "$RUNNER_TEMP/version.json" \
            --expected-sha "$GITHUB_SHA" \
            --expected-selector "d0b5ace1116f1483c7e818cab775b68ab357e2a6"
