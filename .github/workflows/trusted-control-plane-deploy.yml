name: trusted-control-plane-deploy

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'harrythentrepreneur/Omo.Space' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: trusted-control-plane-deploy
      cancel-in-progress: false
    steps:
      - name: Check out exact protected main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact dispatch revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/deploy/package-lock.json
      - name: Install pinned Worker dependencies
        working-directory: site/deploy
        run: npm ci --ignore-scripts
      - name: Verify reviewed selector and dry run
        working-directory: site/deploy
        shell: bash
        run: |
          test "$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('wrangler.toml').read_text(encoding='utf-8')
          match = re.search(r'^OMO_BUILDER_BASE_REVISION = "([0-9a-f]{40})"$', text, re.MULTILINE)
          if match is None:
              raise SystemExit(1)
          print(match.group(1))
          PY
          )" = "d0b5ace1116f1483c7e818cab775b68ab357e2a6"
          npx wrangler@4.123.0 deploy --dry-run --keep-vars --env=""
      - name: Deploy reviewed Worker
        working-directory: site/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.123.0 deploy --keep-vars --env=""
      - name: Read back 100 percent active version
        id: allocation
        working-directory: site/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          npx wrangler@4.123.0 deployments status --json --env="" > "$RUNNER_TEMP/deployment.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          value = json.loads(Path(os.environ['RUNNER_TEMP'], 'deployment.json').read_text())
          found = []
          def walk(item):
              if isinstance(item, dict):
                  percentage = item.get('percentage')
                  version = item.get('version_id') or item.get('versionId') or item.get('id')
                  if percentage in (100, 100.0) and isinstance(version, str):
                      found.append(version)
                  for child in item.values():
                      walk(child)
              elif isinstance(item, list):
                  for child in item:
                      walk(child)
          walk(value)
          versions = sorted(set(found))
          if len(versions) != 1 or not re.fullmatch(r'[0-9a-f-]{32,40}', versions[0]):
              raise SystemExit('active Worker allocation is not exactly one reviewed version')
          Path(os.environ['RUNNER_TEMP'], 'version-id.txt').write_text(versions[0], encoding='utf-8')
          print('allocation=100')
          PY
          version_id="$(cat "$RUNNER_TEMP/version-id.txt")"
          npx wrangler@4.123.0 versions view "$version_id" --json --env="" > "$RUNNER_TEMP/version.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          expected = 'd0b5ace1116f1483c7e818cab775b68ab357e2a6'
          value = json.loads(Path(os.environ['RUNNER_TEMP'], 'version.json').read_text())
          matched = False
          def walk(item):
              global matched
              if isinstance(item, dict):
                  if item.get('name') == 'OMO_BUILDER_BASE_REVISION' and (item.get('text') == expected or item.get('value') == expected):
                      matched = True
                  for child in item.values():
                      walk(child)
              elif isinstance(item, list):
                  for child in item:
                      walk(child)
          walk(value)
          if not matched:
              raise SystemExit('live Worker selector does not match reviewed revision')
          print('OMO_BUILDER_BASE_REVISION=verified')
          PY
