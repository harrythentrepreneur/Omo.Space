name: trusted-release-merge

on:
  workflow_run:
    workflows: [generated-workflow-contracts, trusted-release-review]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: trusted-release-merge
  cancel-in-progress: false

jobs:
  merge:
    if: github.repository == 'harrythentrepreneur/Omo.Space'
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted merge controller from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.TRUSTED_RELEASE_REVIEW_TOKEN }}
          persist-credentials: true
          path: controller
      - name: Evaluate protected release PRs and merge exact approved heads
        env:
          # A non-GITHUB_TOKEN identity is required so the merge commit can
          # trigger the protected push/finalization workflows.
          GH_TOKEN: ${{ secrets.TRUSTED_RELEASE_REVIEW_TOKEN }}
        run: |
          if [ ! -f controller/tools/host-skill/release_merge_controller.py ]; then
            echo "trusted merge controller is not on main yet; bootstrap no-op"
            exit 0
          fi
          python3 controller/tools/host-skill/release_merge_controller.py \
            --event "$GITHUB_EVENT_PATH"
