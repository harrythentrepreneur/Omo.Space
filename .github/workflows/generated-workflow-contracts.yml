name: generated-workflow-contracts

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install builder privilege launcher
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends util-linux
          test -x /usr/bin/setpriv
      - name: Install Python test dependencies
        run: python -m pip install pytest jsonschema pyyaml pillow reportlab pypdf numpy modal==1.3.4
      - name: Python host/compiler/render contracts
        run: |
          PYTHON_BIN="$(command -v python)"
          sudo env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. "$PYTHON_BIN" -m pytest -q tools/host-skill/tests tools/skill-to-modal/tests tools/render/tests
      - name: Worker and API contracts
        run: |
          node site/deploy/test-workers.mjs
          node site/deploy/test-router.mjs
          node site/deploy/test-balance.mjs
          node site/deploy/test-cost.mjs
          node api/tests/run-handler.test.mjs
          node api/tests/reconcile-handler.test.mjs
      - name: Syntax and diff checks
        run: |
          find tools packages containers research -name '*.py' -print0 | xargs -0 python -m py_compile
          node --check site/deploy/worker.js
          node --check site/upload.js
          node --check site/deploy/hosted-skills.generated.mjs
          git diff --check
