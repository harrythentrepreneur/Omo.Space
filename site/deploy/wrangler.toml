# Cognition — demo API worker (single project, routes dispatched in worker.js)
#
# Deploy:
#   1. npm i -g wrangler
#   2. wrangler login
#   3. wrangler secret put LLM_API_KEY     # value: the opencode/deepseek key (NEVER in this file)
#   4. wrangler deploy                     # from site/deploy/
#
# Routes are handled INSIDE worker.js by URL path:
#   /api/ugc-script-studio
#   /api/meta-ads-analyser
#   /api/product-photo-generator
#   /api/run               (catalog runner — Clerk/API-key auth + idempotent debit in real mode)
#   /api/checkout          (guest Stripe Checkout; server-priced catalog licenses)
#   /api/me                (balance + api key + usage for the dashboard)
#   /api/topup             (Stripe Checkout for credit top-ups)
#   /api/clerk-webhook     (user.created → $5 signup grant)
#   /api/pilot/claim       (signed pilot link verification + authenticated 99-cent grant)
#
# To attach a custom domain instead of the workers.dev URL, either:
#   a) Dashboard: Workers & Pages → cognition-demos → Settings → Domains & Routes
#      → Add custom domain → demo.cognition.cv   (Cloudflare auto-creates the DNS record), or
#   b) uncomment the [[routes]] block below (custom_domain = true attaches it at deploy time).

name = "cognition-demos"
main = "worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/1 * * * *"]

# [[routes]]
# pattern = "omo.space/api/*"
# custom_domain = true

# Optional: per-IP daily caps need a KV namespace (without it the worker runs uncapped).
#   1. wrangler kv namespace create BENCH_KV
#   2. paste the returned id below, then uncomment.
# [[kv_namespaces]]
# binding = "BENCH_KV"
# id = "PASTE_NAMESPACE_ID_HERE"

# Credits backend — pooled Neon Postgres is preferred. Install dependencies,
# apply schema.sql to Neon, then store NEON_DATABASE_URL as a Worker secret:
#   npm install
#   psql "$NEON_DATABASE_URL" -f schema.sql
#   npx wrangler secret put NEON_DATABASE_URL
#
# D1 remains an optional fallback. To enable it:
#   1. npx wrangler d1 create omo-balances
#   2. paste the returned database_id below, then uncomment
#   3. npx wrangler d1 execute omo-balances --file=schema.sql
# Without this binding the worker runs in MOCK mode: an in-memory Map gives
# every user $5 and a deterministic 'omo_' key, so tests and local dev work
# with zero infra. In real mode the binding name must be BALANCE_DB.
# [[d1_databases]]
# binding = "BALANCE_DB"
# database_name = "omo-balances"
# database_id = "PASTE_D1_DATABASE_ID_HERE"

# Pilot links also require a separate HMAC secret (32+ random bytes):
#   npx wrangler secret put PILOT_MAGIC_LINK_SECRET
# Keep issuance server-side with generate-pilot-link.mjs; never expose this
# secret or add a public token-minting route.

[vars]
ENVIRONMENT = "production"
LLM_BASE_URL = "https://opencode.ai/zen/go/v1"
LLM_MODEL = "deepseek-v4-flash"
CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsub21vLnNwYWNlJA"
MIN_TOPUP_USD = "5"
MAX_TOPUP_USD = "1000"
CLERK_CLOCK_SKEW_SECONDS = "5"
RUN_RESERVATION_TTL_SECONDS = "300"
PILOT_GRANT_CENTS = "99"
PILOT_BOOK_BUILDER_PATH = "/run.html?slug=decodable-book-maker"
OMO_SUPPORT_BROKER_URL = "https://cognition.cv/omo-support-api/v1/chat"
OMO_BUILDER_MODAL_URL = "https://omo-space--omo-hermes-builder-dispatch.modal.run"
OMO_BUILDER_BASE_REVISION = "b8419d7a8fe12a26b09a7b5590bd1b40dfd8ad83"
# Hosted Facebook Ads runtime in the phonicsmaker / OMOSpace Modal environment.
FACEBOOK_ADS_MODAL_URL = "https://phonicsmaker-omospace--cognition-facebook-ads-copywriter-api.modal.run"

# Stripe test and production use the identical worker code. Set the matching
# STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET with `wrangler secret put`; send
# checkout.session.completed to https://omo.space/api/topup for both catalog
# purchases and credit top-ups. Swap test secrets for live secrets only when
# promoting the deployment.

# Demo caps per route (per IP per day) — mirror each SKILL.md demo_caps.
# UGC Script Studio
DEMO_MAX_TOKENS_UGC = "4000"
DEMO_MAX_INPUT_UGC = "2000"
DEMO_DAILY_CAP_UGC = "5"
# Meta Ads Analyser
DEMO_MAX_TOKENS_META = "5000"
DEMO_MAX_INPUT_META = "20000"
DEMO_DAILY_CAP_META = "3"
# Product Photo Generator
DEMO_MAX_TOKENS_PHOTO = "4000"
DEMO_MAX_INPUT_PHOTO = "2000"
DEMO_DAILY_CAP_PHOTO = "5"
# Generic mock/demo runner (real mode uses each server-catalog token cap)
DEMO_MAX_TOKENS_RUN = "4000"
DEMO_MAX_INPUT_RUN = "3000"
DEMO_DAILY_CAP_RUN = "20"

[observability]
enabled = true

# Issue #141 staging target. `wrangler deploy --env staging` creates the
# separate `cognition-demos-staging` Worker on workers.dev only. It deliberately
# inherits no production routes, schedules, bindings, variables, or secrets.
[env.staging]
name = "cognition-demos-staging"
workers_dev = true
routes = []

[env.staging.triggers]
crons = []

[env.staging.vars]
ENVIRONMENT = "staging"
LABEL_NORMALIZER_CANARY_MODAL_URL = "https://omo-space-omo-release-staging--cognition-staging-label-n-11704d.modal.run"

# Dedicated non-production durable state for the Issue #141 public canary.
# Wrangler provisions this resource only when D1 edit authority is present and
# writes the immutable database_id back before the reviewed deployment.
[[env.staging.d1_databases]]
binding = "BALANCE_DB"
