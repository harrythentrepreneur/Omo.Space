<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Your free PhonicsMaker book</title>
  <link rel="stylesheet" href="nav-footer.css">
  <link rel="stylesheet" href="signup-modal.css">
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f8f7f5; color: #17352c; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(560px, 100%); background: #fff; border: 2px solid #17352c; border-radius: 24px 24px 6px 24px; padding: clamp(28px, 7vw, 54px); box-sizing: border-box; box-shadow: 10px 10px 0 #f6c650; }
    .eyebrow { color: #d45b3e; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(34px, 8vw, 54px); line-height: 1; letter-spacing: -.04em; }
    p { font-size: 18px; line-height: 1.55; }
    button { appearance: none; border: 0; border-radius: 999px; padding: 14px 22px; background: #17352c; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    button[hidden] { display: none; }
    button:disabled { cursor: wait; opacity: .65; }
    .small { color: #586a64; font-size: 14px; }
  </style>
</head>
<body>
  <main aria-labelledby="pilot-title">
    <span class="eyebrow">PhonicsMaker pilot</span>
    <h1 id="pilot-title">Your free book is waiting.</h1>
    <p id="pilot-status" role="status">Checking your link…</p>
    <button id="pilot-auth" type="button" hidden>Create account or log in</button>
    <p class="small">No card needed. This link adds one $0.99 book to your balance.</p>
  </main>
  <script src="key-config.js"></script>
  <script src="clerk.js"></script>
  <script src="signup-modal.js"></script>
  <script src="pilot-claim.js"></script>
</body>
</html>
