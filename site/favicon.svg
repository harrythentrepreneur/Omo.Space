<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Omo</title>
  <defs>
    <linearGradient id="tile" x1="8" y1="4" x2="57" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#284A40"/>
      <stop offset="0.52" stop-color="#1E3A34"/>
      <stop offset="1" stop-color="#102720"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientTransform="translate(18 12) rotate(47) scale(50)">
      <stop stop-color="#BDEFD4" stop-opacity="0.16"/>
      <stop offset="0.58" stop-color="#BDEFD4" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#BDEFD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="16" y1="12" x2="49" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF6"/>
      <stop offset="0.46" stop-color="#E5F7EC"/>
      <stop offset="1" stop-color="#BDEFD4"/>
    </linearGradient>
    <radialGradient id="dot" cx="0" cy="0" r="1" gradientTransform="translate(28.5 26.5) rotate(50) scale(14)">
      <stop stop-color="#FF926D"/>
      <stop offset="0.48" stop-color="#FF6B3D"/>
      <stop offset="1" stop-color="#DA4A27"/>
    </radialGradient>
    <path id="tile-shape" d="M14 0H50C57.7 0 64 6.3 64 14V54L54 64H14C6.3 64 0 57.7 0 50V14C0 6.3 6.3 0 14 0Z"/>
