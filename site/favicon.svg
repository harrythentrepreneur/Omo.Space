  <use href="#tile-shape" fill="url(#tile)"/>
  <use href="#tile-shape" fill="url(#sheen)"/>

  <!-- A soft mint halo and offset pine edge give the O workshop-made depth. -->
  <circle cx="31.5" cy="30.5" r="22" fill="none" stroke="#BDEFD4" stroke-width="3" opacity="0.16"/>
  <circle cx="32.5" cy="32" r="20" fill="none" stroke="#0B211B" stroke-width="10" opacity="0.46"/>
  <circle cx="31.5" cy="30.5" r="20" fill="none" stroke="url(#ring)" stroke-width="9.5"/>

  <circle cx="32.4" cy="31.6" r="8.6" fill="#0B211B" opacity="0.48"/>
  <circle cx="31.5" cy="30.5" r="8.25" fill="url(#dot)"/>
  <circle cx="28.8" cy="27.4" r="1.7" fill="#FFE8DB" opacity="0.88"/>
</svg>
