# Install inside the existing HTTPS server block for cognition.cv.
# Cloudflare Worker calls only this exact endpoint. All other broker paths remain private.
location = /omo-support-api/v1/chat {
    auth_basic off;
    limit_except POST { deny all; }
    client_max_body_size 16k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 95s;
    proxy_pass http://127.0.0.1:18771/v1/chat;
}

# Health is loopback-only; do not expose it publicly.
location = /omo-support-api/health {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:18771/health;
}
